name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Android Project Files
      run: |
        python3 -c "
        import os
        with open('settings.gradle', 'w') as f:
            f.write('''pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        include ':app'
        ''')

        with open('build.gradle', 'w') as f:
            f.write('''plugins {
            id 'com.android.application' version '8.1.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
        }''')

        os.makedirs('app', exist_ok=True)
        with open('app/build.gradle', 'w') as f:
            f.write('''plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.serialhex'
            compileSdk 33
            defaultConfig {
                applicationId \\\"com.example.serialhex\\\"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName \\\"1.0\\\"
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
        }''')

        os.makedirs('app/src/main', exist_ok=True)
        manifest_path = 'app/src/main/AndroidManifest.xml'
        if not os.path.exists(manifest_path):
            with open(manifest_path, 'w') as f:
                f.write('''<manifest xmlns:android=\\\"http://schemas.android.com/apk/res/android\\\" package=\\\"com.example.serialhex\\\">\n    <application />\n</manifest>''')
        "

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
